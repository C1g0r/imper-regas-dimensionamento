<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imper Regas | Pivot Engineering</title>
<meta name="theme-color" content="#123B66">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--navy:#123B66;--brand:#1677C8;--brand2:#36A9D6;--bg:#F1F5F9;--card:#fff;--line:#d9e3ee;--ink:#17324d;--mut:#5d7389;--ok:#1d9a5b;--warn:#d98a00;--bad:#cf3b3b;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.brand img{height:46px;width:auto}.brand b{display:block;font-size:1.1rem;letter-spacing:.02em}.brand small{display:block;color:var(--brand);font-weight:600}
.hd .sp{flex:1}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.btn:hover{background:var(--navy)}.btn.g{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.g:hover{background:#eaf2fa}
.btn.d{background:#fff;color:var(--bad);border:1px solid #f0c8c8}.btn.s{padding:6px 12px;font-size:.8rem}
.wrap{max-width:1400px;margin:0 auto;padding:18px;display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
aside{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px;position:sticky;top:84px}
aside h3{margin:2px 6px 10px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.mod{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:#fff;padding:9px 10px;border-radius:12px;cursor:pointer}
.mod:hover{background:rgba(255,255,255,.1)}.mod.on{background:#fff;color:var(--navy)}
.mod i{font-style:normal;font-weight:700;font-size:.8rem;min-width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.mod.on i{background:var(--brand);color:#fff}.mod span{font-size:.9rem;line-height:1.2}
.mod small{display:block;opacity:.65;font-size:.72rem}.mod.soon{opacity:.55}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(18,59,102,.05)}
h1{margin:0 0 4px;font-size:1.6rem;color:var(--navy)}h2{margin:0 0 12px;font-size:1.15rem;color:var(--navy)}h3.s{margin:14px 0 8px;font-size:.95rem;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:.8rem;color:var(--mut);font-weight:600}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:500;color:var(--ink)}
label input:focus,label select:focus,label textarea:focus{outline:2px solid var(--brand2);border-color:var(--brand2)}
.u{font-weight:400;opacity:.7}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:linear-gradient(180deg,#fff,#f5f9fd);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mut);font-weight:600;font-size:.78rem}.kpi b{display:block;font-size:1.55rem;color:var(--navy);margin-top:2px}.kpi b em{font-style:normal;font-size:.85rem;color:var(--mut);font-weight:600}
.kpi.dim b{color:#9db0c2}
.bar{height:9px;border-radius:9px;background:#e4ecf4;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px}
.prow{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right}.tw{overflow-x:auto}
td input{width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700}
.pill.ok{background:#dcf3e7;color:var(--ok)}.pill.w{background:#fdf0d4;color:#a86b00}.pill.b{background:#fbe0e0;color:var(--bad)}.pill.i{background:#e3effa;color:var(--brand)}
.al{display:flex;gap:10px;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:.88rem;border:1px solid}
.al.i{background:#eef5fc;border-color:#cfe2f4}.al.w{background:#fff7e6;border-color:#f3dba7}.al.b{background:#fdeeee;border-color:#f0c8c8}.al.ok{background:#e9f7f0;border-color:#bfe5d1}
.split>div{min-width:0}.split{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;align-items:start}
.draw{position:relative;background:#f7fbff;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
.draw svg{display:block;width:100%;height:min(66vh,560px);cursor:grab}.draw svg:active{cursor:grabbing}
.dtool{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.dtool button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.1rem;cursor:pointer;color:var(--navy)}
.dleg{position:absolute;right:10px;bottom:8px;font-size:.74rem;color:var(--mut);background:rgba(255,255,255,.85);padding:3px 8px;border-radius:8px}
.hint{color:var(--mut);font-size:.8rem}
.pl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel td{background:#eef5fc}
.empty{text-align:center;color:var(--mut);padding:26px}
.soonbox{text-align:center;padding:40px 20px}.soonbox .ph{display:inline-block;margin-top:8px}
.tabsm{display:none}
.foot{text-align:center;color:var(--mut);font-size:.78rem;padding:10px 18px 30px}
@media(max-width:980px){.wrap{grid-template-columns:minmax(0,1fr);padding:12px}aside{position:static;display:flex;overflow-x:auto;gap:6px;padding:8px;border-radius:14px}aside h3{display:none}
.mod{width:auto;flex:0 0 auto;padding:7px 10px}.mod small{display:none}.split{grid-template-columns:minmax(0,1fr)}.kpis,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.prow{grid-template-columns:100px 1fr 40px}h1{font-size:1.3rem}.brand img{height:38px}}
@media print{header,aside,.noprint,.dtool{display:none!important}.wrap{display:block}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>

<script>
(function(){
'use strict';
var KEY='ir_pivot',MODS=[
['01','Projetos e explorações','Criar, editar e gerir projetos',1],
['02','Caracterização da parcela','Localização, terreno e solo',1],
['03','Dimensionamento geométrico','Raio, vãos, torres e área',1],
['04','Dimensionamento agronómico','Culturas, ET0, Kc',0,'Fase 3'],
['05','Dimensionamento hidráulico','Caudais, tubagens, perdas',0,'Fase 3'],
['06','Aspersores e emissores','Débitos e distribuição',0,'Fase 4'],
['07','Bombagem e energia','HMT, potência, consumo',0,'Fase 4'],
['08','Planeamento da rega','Dotações e calendários',0,'Fase 5'],
['09','Simulação e análise','Cenários e desempenho',0,'Fase 5'],
['10','Relatórios técnicos','Memória descritiva, PDF',0,'Fase 6']];
var ST={list:[],cur:null,mod:'01'};
function $(i){return document.getElementById(i)}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function newProj(name){return{id:uid(),name:name||'Novo projeto',client:'',loc:'',parcel:'',areaTot:'',crop:'',water:'Furo',tech:'',created:today(),arch:0,
par:{len:'',wid:'',zmin:'',zmax:'',slope:'',soil:'Franco',inf:'',ret:'',lat:'',lon:''},
geo:{spans:[60,60,60,60,60,60],lb:20,gun:false,G:0,theta:360,start:0,ox:0,oy:0}}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.list){ST.list=d.list;ST.cur=d.cur;ST.mod=d.mod||'01'}}catch(e){}
if(!ST.list.length){var p=newProj('Exploração exemplo');ST.list.push(p);ST.cur=p.id}
if(!P())ST.cur=ST.list[0].id}
var tmr;function save(){try{localStorage.setItem(KEY,JSON.stringify({list:ST.list,cur:ST.cur,mod:ST.mod}));$('saved').textContent='Guardado automaticamente';clearTimeout(tmr);tmr=setTimeout(function(){$('saved').textContent=''},1800)}catch(e){$('saved').textContent='Sem espaço para guardar'}}
function P(){return ST.list.filter(function(p){return p.id===ST.cur})[0]}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null}
function f(v,d){if(v===null||v===undefined||!isFinite(v))return '—';return v.toLocaleString('pt-PT',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- motor de cálculo (independente da interface) ---------- */
var Calc={
geo:function(g){
 var sp=g.spans.map(function(x){return Math.max(0,num(x)||0)}),lb=Math.max(0,num(g.lb)||0),G=g.gun?Math.max(0,num(g.G)||0):0,th=Math.min(360,Math.max(0,num(g.theta)||0));
 var sum=sp.reduce(function(a,b){return a+b},0),L=sum+lb,R=L+G;
 var k=th/360,A=function(r){return Math.PI*r*r/10000};
 var tw=[],acc=0;sp.forEach(function(s,i){acc+=s;tw.push({n:i+1,at:acc,len:s})});
 var secs=[],r0=0;sp.forEach(function(s,i){var r1=r0+s;secs.push({n:'Vão '+(i+1),r0:r0,r1:r1,len:s,area:(A(r1)-A(r0))*k});r0=r1});
 if(lb>0){secs.push({n:'Balanço',r0:r0,r1:r0+lb,len:lb,area:(A(r0+lb)-A(r0))*k});r0+=lb}
 if(G>0)secs.push({n:'Canhão',r0:r0,r1:r0+G,len:G,area:(A(r0+G)-A(r0))*k});
 return{n:sp.length,sp:sp,sum:sum,lb:lb,G:G,th:th,L:L,R:R,D:2*R,P:2*Math.PI*R,Afull:A(R),As:A(R)*k,ApL:A(L)*k,towers:tw,secs:secs,avgT:sp.length?sum/sp.length:0}},
parcel:function(par,g,c){
 var len=num(par.len),wid=num(par.wid);if(!len||!wid||!c.R||!c.th)return null;
 var ox=num(g.ox)||0,oy=num(g.oy)||0,st=(num(g.start)||0),th=c.th,R=c.R,hx=len/2,hy=wid/2,inside=0,NR=160,NT=Math.max(90,Math.round(th)),dr=R/NR,dt=th/NT;
 for(var i=0;i<NR;i++){var r=(i+.5)*dr;for(var j=0;j<NT;j++){var a=(st+(j+.5)*dt)*Math.PI/180,x=ox+r*Math.sin(a),y=oy+r*Math.cos(a);
  if(Math.abs(x)<=hx&&Math.abs(y)<=hy)inside+=r*dr*dt*Math.PI/180}}
 var ar=len*wid/10000,ins=inside/10000;return{area:ar,inside:ins,outside:c.As-ins,uncov:ar-ins,pct:ar?ins/ar*100:0}}
};

/* ---------- navegação ---------- */
function side(){var h='<h3>Módulos</h3>';MODS.forEach(function(m){h+='<button class="mod'+(ST.mod===m[0]?' on':'')+(m[3]?'':' soon')+'" data-m="'+m[0]+'"><i>'+m[0]+'</i><span>'+m[1]+'<small>'+(m[3]?m[2]:m[4]+' · em breve')+'</small></span></button>'});$('side').innerHTML=h;
[].forEach.call($('side').querySelectorAll('.mod'),function(b){b.onclick=function(){go(b.dataset.m)}})}
function go(m){ST.mod=m;save();side();render();window.scrollTo({top:0})}
function render(){var m=ST.mod,x=$('main');
 if(m==='01')vProj(x);else if(m==='02')vPar(x);else if(m==='03')vGeo(x);else vSoon(x,m)}
function vSoon(x,m){var d=MODS.filter(function(a){return a[0]===m})[0];x.innerHTML='<div class="card soonbox"><h1>'+d[0]+' · '+d[1]+'</h1><p class="sub">'+d[2]+'</p><span class="pill i ph">Previsto para a '+d[4]+'</span><p class="hint" style="margin-top:14px">Este módulo vai usar automaticamente a área e a geometria calculadas no módulo 03.</p></div>'}

/* ---------- progresso / estado ---------- */
function prog(p){var g=p.geo,par=p.par;
 var gOk=0,gT=5;if(g.spans.length)gOk++;if(num(g.lb)!==null)gOk++;if(num(g.theta))gOk++;if(!g.gun||num(g.G)!==null)gOk++;if(g.spans.every(function(s){return num(s)>0}))gOk++;
 var pf=['len','wid','zmin','zmax','slope','soil','inf','ret'],pOk=pf.filter(function(k){return String(par[k]).trim()!==''}).length;
 var jf=['name','client','loc','parcel','areaTot','crop','water','tech'],jOk=jf.filter(function(k){return String(p[k]).trim()!==''}).length;
 return{geo:Math.round(gOk/gT*100),par:Math.round(pOk/pf.length*100),proj:Math.round(jOk/jf.length*100),agro:0,hid:0,bomb:0}}

/* ---------- 01 Projetos ---------- */
function vProj(x){var p=P(),c=Calc.geo(p.geo),pg=prog(p);
 var h='<div class="card"><h1>Centro de dimensionamento</h1><p class="sub">Projeto ativo: <b>'+esc(p.name)+'</b>'+(p.client?' · '+esc(p.client):'')+'</p>'+
 '<div class="kpis"><div class="kpi"><small>Área irrigada</small><b>'+f(c.As,2)+' <em>ha</em></b></div><div class="kpi"><small>Raio do pivot</small><b>'+f(c.R,0)+' <em>m</em></b></div><div class="kpi dim"><small>Caudal de projeto</small><b>— <em>m³/h</em></b></div><div class="kpi dim"><small>Potência estimada</small><b>— <em>kW</em></b></div></div>'+
 '<h3 class="s">Progresso do dimensionamento</h3>'+
 [['Projeto',pg.proj],['Parcela',pg.par],['Geometria',pg.geo],['Agronomia',0],['Hidráulica',0],['Bombagem',0]].map(function(r){return '<div class="prow"><span>'+r[0]+'</span><div class="bar"><i style="width:'+r[1]+'%"></i></div><b>'+r[1]+'%</b></div>'}).join('')+'</div>';
